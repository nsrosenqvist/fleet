# Lima template for the `fleet-vm` instance.
#
# A small Ubuntu 24.04 LTS VM provisioned with the full set of tools the
# @aoagents/ao orchestrator needs. fleet's TUI invokes
# `limactl start --tty=false --name=fleet-vm <this-file>` on the
# missing-VM path; after that Lima copies the resolved config into
# ~/.lima/fleet-vm/ and subsequent starts ignore this file entirely.
#
# Re-provisioning model: Lima's `/var/lib/cloud/scripts/per-boot/00-lima.boot.sh`
# re-runs every `provision:` block on every VM boot — *not* once, despite
# how cloud-init usually behaves. Each script below short-circuits via a
# marker file (`/var/lib/fleet/.system-provisioned-vN` and friends) so
# the expensive bits (`apt update`, `npm install -g`, gh-dash) run only
# the first time. To force a refresh after editing the script, bump the
# `-vN` suffix on the marker so the next boot redoes the work; for a
# clean rebuild, `limactl delete fleet-vm` and let fleet recreate it.
#
# Why marker-based and not "let Lima skip per-boot": Lima 2.x always runs
# `provision:` blocks every boot — we can't opt out at the Lima layer.
# Without the marker, every Shift+X → Shift+S cycle inside fleet costs
# minutes of redundant `npm install` and risks corrupting the install
# tree if the VM is SIGTERM'd mid-rename (the bug that surfaced this).

images:
  - location: "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img"
    arch: "x86_64"
  - location: "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-arm64.img"
    arch: "aarch64"

# Sized for a single concurrent agent worker doing typical software-eng
# tasks (cargo / npm builds, gh CLI calls, claude-code IO). Bump if you
# run multiple sessions in parallel.
cpus: 4
memory: "4GiB"
disk: "30GiB"

# Force virtiofs for faster file IO than 9p on Linux hosts. (The two-user
# experiment that originally needed this also needed POSIX ACL passthrough
# on the mount, which neither 9p nor virtiofs supports in this Lima/QEMU
# build — see docs/security-model.md → "Drop-priv (deferred)".)
mountType: virtiofs

# Filesystem isolation. The host home is intentionally NOT bind-mounted.
# AO + every worker process runs as the default Lima user inside the
# guest. Only the two paths AO actually needs cross the boundary, plus
# per-project source repos auto-spliced in by fleet's bring-up code:
#
#   1. ~/.agent-orchestrator/ — AO worktrees + session state. Writable.
#      The same absolute path resolves on both host and guest so
#      `cd ~/.agent-orchestrator/projects/<p>/worktrees/<id>` works
#      identically from either side.
#
#   2. ~/.config/fleet/ — the AO catalog (agent-orchestrator.yaml) and
#      worker AGENTS.md. **Read-only**: a worker must not be able to
#      append a `projects:` entry that points at an arbitrary host path
#      and thereby escape the sandbox on the next spawn.
#
# Per-project source repo mounts are auto-derived from agent-orchestrator
# .yaml's projects.*.path + plugins[].path and spliced in by fleet's
# bring-up code (see src/tui/bringup.rs::compose_template). The static
# block here only covers the two paths every fleet install needs.
#
# Identity material (Claude OAuth, GH_TOKEN, .gitconfig) is brokered in
# at `fleet start` time via env vars and written to VM-private files
# inside the bootstrap script — see src/cli/spawn.rs::BOOTSTRAP_SCRIPT.
# Everything else under the lima user's $HOME lives on the VM's private
# ext4 and never touches the host filesystem.
mounts:
  - location: "~/.agent-orchestrator"
    writable: true
  - location: "~/.config/fleet"
    writable: false
  # __FLEET_EXTRA_MOUNTS__ — fleet splices project source mounts here at
  # bring-up time, auto-derived from agent-orchestrator.yaml's
  # projects.*.path and plugins[].path. See src/tui/bringup.rs.
  # __FLEET_EXTRA_MOUNTS_END__

provision:
  # System-level install: distro packages, Node 20 (NodeSource), gh CLI,
  # and the @aoagents/ao + claude-code npm globals. Runs as root, so npm
  # globals land in /usr/lib/node_modules with bins symlinked to /usr/bin
  # — that puts them on PATH for any shell `limactl shell` spawns
  # without depending on .bashrc being sourced.
  - mode: system
    script: |
      #!/bin/bash
      set -eux

      # Idempotency gate. Lima re-runs this script on every boot; the
      # marker file lets the second-and-later runs short-circuit in
      # milliseconds instead of redoing apt + npm. Bump the version
      # suffix when the body below adds/changes anything that needs
      # to land on existing VMs.
      PROVISION_MARKER="/var/lib/fleet/.system-provisioned-v1"
      if [ -f "$PROVISION_MARKER" ]; then
          exit 0
      fi

      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y \
        ca-certificates curl git gnupg tmux build-essential tinyproxy

      # Node 20 (NodeSource). Ubuntu's apt-shipped nodejs trails by a
      # couple of majors; @aoagents/ao requires node ≥ 20.
      curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      apt-get install -y nodejs

      # gh CLI. Noble's repo carries 2.45+ which satisfies the AO
      # docs' "git 2.25+, gh recent" requirement; fall back to GitHub's
      # apt source if the distro package is missing or too old.
      if ! apt-get install -y gh; then
        mkdir -p -m 755 /etc/apt/keyrings
        curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
          | dd of=/etc/apt/keyrings/githubcli-archive-keyring.gpg
        chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
          > /etc/apt/sources.list.d/github-cli.list
        apt-get update
        apt-get install -y gh
      fi

      npm install -g @aoagents/ao @anthropic-ai/claude-code

      # git-bug: not in apt, so pull the upstream release binary
      # straight into /usr/local/bin. Matches the install fleet's
      # preflight auto-install action runs against existing VMs.
      arch="$(dpkg --print-architecture)"
      case "$arch" in
        amd64) gb_arch=amd64 ;;
        arm64) gb_arch=arm64 ;;
        *)     gb_arch="$arch" ;;
      esac
      curl -fsSL "https://github.com/git-bug/git-bug/releases/latest/download/git-bug_linux_${gb_arch}" \
        -o /usr/local/bin/git-bug
      chmod +x /usr/local/bin/git-bug

      # Drop the marker last so a mid-script failure (network blip,
      # apt mirror flaky) leaves the marker absent and the next boot
      # retries from the top.
      mkdir -p "$(dirname "$PROVISION_MARKER")"
      touch "$PROVISION_MARKER"

  # gh-dash extension for the gh CLI. Provides the github tracker's
  # TUI preview (fleet's `t` keybind on github projects). Runs as the
  # lima user. With the host home no longer bind-mounted, `gh` has no
  # auth at first-boot provisioning time, so the install is best-effort
  # (`|| true`) and the preflight modal offers to install gh-dash on
  # demand once GH_TOKEN brokering has supplied auth.
  - mode: user
    script: |
      #!/bin/bash
      set -eu
      # Same idempotency model as the system script. User-scope marker
      # lives in $HOME so it persists across reboots without touching
      # /var/lib (which is system-owned).
      PROVISION_MARKER="$HOME/.local/share/fleet/.user-provisioned-v1"
      if [ -f "$PROVISION_MARKER" ]; then
          exit 0
      fi
      if command -v gh >/dev/null 2>&1; then
        gh extension install dlvhdr/gh-dash 2>/dev/null || true
      fi
      mkdir -p "$(dirname "$PROVISION_MARKER")"
      touch "$PROVISION_MARKER"

  # Tinyproxy + egress allowlist (fleet Phase 3). Always provisioned so
  # the proxy is present even in `network.mode = open` setups (where
  # fleet just doesn't forward `HTTPS_PROXY` to workers). At fleet
  # start time, `network::sync_in_vm_filter` rewrites the filter file
  # and reloads tinyproxy. We ship a `FilterDefaultDeny Yes` config:
  # an empty filter rejects every host. So the proxy is safe by
  # default — it can't accidentally permit anything before fleet's
  # first sync runs.
  - mode: system
    script: |
      #!/bin/bash
      set -eu
      PROVISION_MARKER="/var/lib/fleet/.tinyproxy-provisioned-v1"
      if [ -f "$PROVISION_MARKER" ]; then
          exit 0
      fi
      mkdir -p /etc/tinyproxy
      # Start with an empty filter — anything not on the allowlist is
      # rejected. fleet writes the real filter via `limactl shell
      # --user root` before AO starts.
      : > /etc/tinyproxy/fleet-allow.filter
      cat > /etc/tinyproxy/tinyproxy.conf <<'CONF'
      # tinyproxy.conf — generated by fleet's cloud-init provisioning.
      # The Filter file is rewritten on every `fleet start` from the
      # resolved allowlist; do not hand-edit (changes will be reverted).

      User tinyproxy
      Group tinyproxy
      Port 8888
      Listen 127.0.0.1
      Timeout 600
      LogLevel Warning
      LogFile "/var/log/tinyproxy/tinyproxy.log"
      MaxClients 100
      DisableViaHeader Yes

      # Allow connections from inside the VM only (the proxy is bound
      # to loopback already, so this is belt + suspenders).
      Allow 127.0.0.1

      # CONNECT method on 443/8443 only — HTTPS for everyone, nothing
      # exotic.
      ConnectPort 443
      ConnectPort 8443

      # Hostname allowlist. `FilterDefaultDeny Yes` means an empty
      # filter rejects everything; the file is regex-anchored
      # (^|\.)host$ entries written by fleet.
      Filter "/etc/tinyproxy/fleet-allow.filter"
      FilterDefaultDeny Yes
      FilterCaseSensitive No
      FilterExtended Yes
      FilterURLs No
      CONF
      systemctl enable --now tinyproxy.service
      mkdir -p "$(dirname "$PROVISION_MARKER")"
      touch "$PROVISION_MARKER"

  # User-supplied provisioning. If the host has a script at
  # `~/.config/fleet/provision.sh` (reachable in the guest via the
  # read-only mount above), run it as root after fleet's own
  # provisioning. The intended use is dropping in toolchains the
  # embedded template doesn't ship — `apt-get install -y golang-go`,
  # `rustup`, language SDKs, etc. — so an agent inside the VM can
  # actually build the user's project.
  #
  # Idempotency: the marker is the script's sha256. Editing
  # provision.sh changes the hash, so the existing marker no longer
  # matches and the next boot re-runs the script; stale markers are
  # cleared on each successful run. A failed user script leaves no
  # marker, so the next boot retries from the top (matching the
  # mid-script-failure model the system blocks above use).
  #
  # Output: `/var/log/fleet/user-provision.log`. Run
  # `limactl shell fleet-vm sudo cat /var/log/fleet/user-provision.log`
  # from the host to inspect.
  #
  # Egress: Lima provision blocks run with no `HTTPS_PROXY` set, so
  # the script bypasses fleet's egress allowlist by design. Anything
  # this hook installs is whatever the user trusts apt / their own
  # commands to fetch.
  - mode: system
    script: |
      #!/bin/bash
      set -euo pipefail
      # The mount above lands at the lima user's $HOME inside the VM.
      # UID 1000 is Lima's default for the lima user; the fleet
      # template doesn't override it.
      LIMA_HOME="$(getent passwd 1000 | cut -d: -f6)"
      USER_SCRIPT="$LIMA_HOME/.config/fleet/provision.sh"
      if [ ! -f "$USER_SCRIPT" ]; then
          exit 0
      fi
      HASH="$(sha256sum "$USER_SCRIPT" | awk '{print $1}')"
      MARKER="/var/lib/fleet/.user-provisioned-$HASH"
      if [ -f "$MARKER" ]; then
          exit 0
      fi
      LOG="/var/log/fleet/user-provision.log"
      mkdir -p "$(dirname "$LOG")" /var/lib/fleet
      {
          echo "=== fleet user-provision @ $(date -Is) hash=$HASH ==="
          bash "$USER_SCRIPT"
          echo "=== fleet user-provision OK ==="
      } 2>&1 | tee -a "$LOG"
      # Only reached on success (pipefail + set -e propagate a failed
      # user script). Drop stale-hash markers so /var/lib/fleet doesn't
      # accumulate one per edit.
      rm -f /var/lib/fleet/.user-provisioned-*
      touch "$MARKER"

  # Drop-priv (separate `aoworker` user, no sudo for agent processes)
  # is **deferred**. Attempting it in Phase 5 hit a wall: neither
  # Lima's 9p nor virtiofs mount type supports POSIX ACLs on the
  # host bind mount in this Lima/QEMU build, so there's no way to
  # grant a second in-VM user rwx on the AO worktree dir. Without
  # that, a non-root aoworker can't write the worktrees AO needs.
  #
  # See docs/security-model.md → "Drop-priv (deferred)" for the
  # state of the art and likely future paths (Lima/virtiofs ACL
  # support, host-side chown of the bind mount, or a different
  # mount mechanism entirely).

probes:
  # Block `limactl start` from declaring the instance Ready until
  # cloud-init has finished (which means every `provision:` block has
  # run, including the `npm install -g @aoagents/ao @anthropic-ai/
  # claude-code` step that can take 13+ minutes on a constrained host).
  #
  # We wait on the canonical "is cloud-init done" signal rather than
  # polling PATH ourselves; the `command -v ao` is a paranoia check that
  # the provision script actually placed ao on PATH. Note that fleet
  # passes `--timeout=30m` to `limactl start`, raising Lima's own
  # outer ceiling so this probe has enough headroom.
  - description: "cloud-init finished and ao on PATH"
    script: |
      #!/bin/bash
      set -eu
      # `cloud-init status --wait` blocks until cloud-init reaches a
      # terminal state, then returns:
      #   0 — done (clean)
      #   1 — still running (shouldn't happen after --wait)
      #   2 — done with recoverable warnings ("degraded done")
      #
      # Lima 2.x's own cloud-init user-data uses some deprecated keys
      # (users.0.uid, users.0.ssh-authorized-keys), which surface as
      # recoverable warnings — so a healthy fleet-vm reliably exits 2.
      # `|| true` accepts both clean and degraded-done. The actual
      # success signal is the next line: ao must be on PATH.
      cloud-init status --wait >/dev/null 2>&1 || true
      command -v ao >/dev/null 2>&1
    hint: |
      cloud-init is still running. Inside the VM:
        sudo cat /var/log/cloud-init-output.log
      to watch progress (or `cloud-init status --long`).
