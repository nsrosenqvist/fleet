[package]
name = "fleet"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/nsrosenqvist/fleet"
description = "Standalone Rust binary for running devcontainer-based agent workflows in any repo."

[[bin]]
name = "fleet"
path = "src/main.rs"

# In-container client for the per-session bridge. Bind-mounted into
# agent containers at /usr/local/bin/fleet-tracker (commit 9 of this
# phase) so an agent can `fleet-tracker comment "…"` against its
# bound ticket.
[[bin]]
name = "fleet-tracker"
path = "src/bin/fleet-tracker.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# TUI
ratatui = "0.30"
crossterm = "0.29"
# Parse ANSI SGR escapes from `tmux capture-pane -e` into styled
# `ratatui::text::Text` so Claude Code's colored output reaches the
# right-pane output preview as styled spans rather than literal
# escape bytes.
ansi-to-tui = "8.0"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Maintained fork of serde_yaml; reads .fleet/config.yaml and
# .fleet/workflows/*.yaml.
serde_yml = "0.0.12"

# Error handling
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Per-session bridge HTTP server. Synchronous; no async runtime
# dragged in. tiny_http handles request parsing + response framing;
# fleet owns route dispatch, bearer auth, and per-session scoping
# on top.
tiny_http = "0.12"

# UUIDv4 for `claude --session-id <uuid>` at brainstorm spawn time
# — we pre-assign so a later respawn can `claude --resume <uuid>`
# deterministically instead of scraping it from the TUI.
uuid = { version = "1", features = ["v4"] }

# SIGINT handler in `fleet workflow run`'s inner so an accidental
# Ctrl+C between nodes inside a tmux pane records a clean "user
# interrupted" failure rather than leaving the session stuck in
# `Running` until the reaper sweeps it.
ctrlc = "3.4"

# Format `updated_at_ms` etc as `YYYY-MM-DD HH:MM:SS UTC` for the
# TUI details pane / sessions show output. Already in the transitive
# tree via signal-hook; promoting to a direct dep for the formatting
# API.
time = { version = "0.3", features = ["formatting", "macros"] }

# Secret material (claude OAuth token, future tracker creds) lives
# in `SecretString` so it never accidentally lands in a Debug print
# or tracing log. The `secrets` module's backends all return one.
secrecy = "0.8"

# Cross-platform OS keyring access for the `keychain` secrets backend:
# macOS Security framework, Linux DBus Secret Service (GNOME
# Keyring / KWallet / KeePassXC), Windows Credential Manager.
keyring = { version = "3", default-features = false, features = [
    "apple-native",
    "linux-native-sync-persistent",
    "sync-secret-service",
    "windows-native",
] }

# Workflow `loop:` parser — accepts humane forms like `1h`, `30m`,
# `6h30m`. Wrapped behind a 60s floor in `workflow::spec` to keep
# the scheduler from hot-spinning.
humantime = "2"

[dev-dependencies]
# Mocks `ProcessInvoker` and other traits so tests don't shell out.
mockall = "0.13"
# Sandboxed temp dirs for SessionStore / repo_config / tracker tests.
tempfile = "3"

[lints.rust]
unused = { level = "warn", priority = -1 }

[lints.clippy]
# Clippy groups (priority -1 so individual rules can override).
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Pedantic lints we explicitly relax for this codebase.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Subprocess wrapping inherently passes through stdio types we don't fully control.
items_after_statements = "allow"
# Trait methods can't be `const fn` on stable; suggestion is noise.
missing_const_for_fn = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
