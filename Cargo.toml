[package]
name = "fleet"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/nsrosenqvist/fleet"
description = "Host-side wrapper + ratatui inspector for the Composio Agent Orchestrator running inside Lima."

[[bin]]
name = "fleet"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# TUI
ratatui = "0.30"
crossterm = "0.29"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

# Error handling
anyhow = "1"
thiserror = "2"

# Secrets handling
secrecy = "0.10"

# Discovery
which = "7"
directories = "6"

# Open URL in browser
webbrowser = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# Used for testing the subprocess-invoker trait without running real subprocesses.
mockall = "0.13"
# Sandboxed temp dirs for config-loading tests.
tempfile = "3"

[lints.rust]
unused = { level = "warn", priority = -1 }

[lints.clippy]
# Clippy groups (priority -1 so individual rules can override).
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Pedantic lints we explicitly relax for this codebase.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Subprocess wrapping inherently passes through stdio types we don't fully control.
items_after_statements = "allow"
# Trait methods can't be `const fn` on stable; suggestion is noise.
missing_const_for_fn = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
